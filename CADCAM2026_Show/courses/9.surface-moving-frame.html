/* Keep the experiment prominent on desktop, with reading material directly below it. */
.lab-layout{grid-template-areas:"demo controls" "guides controls";row-gap:22px}
.stage-box{grid-area:demo;min-width:0}
.side{grid-area:controls;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow-y:auto;scrollbar-gutter:stable;min-width:0}
.console-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;padding-bottom:18px}
.console-summary::-webkit-details-marker{display:none}
.console-summary h2{margin:0;font-size:16px}
.console-summary span{font-size:11px;color:var(--muted);white-space:nowrap}
.side details:not([open]) .console-summary{padding-bottom:0}
.info-grid{grid-area:guides;grid-template-columns:minmax(0,1fr);margin-top:0;gap:18px;min-width:0}
.info{min-width:0;padding:26px 28px}
.info h2{font-size:20px;margin-bottom:20px;line-height:1.5}
.info-theory{border-top:2px solid #3d8f91}
.info-theory p,.info-theory li{font-size:17px;line-height:1.95;color:#c3d1e2;overflow-wrap:anywhere}
.info-explore p,.info-explore li{font-size:15.5px;line-height:1.9;color:#b9c9dc;overflow-wrap:anywhere}
.info p:last-child{margin-bottom:0}
.formula{font:18px/1.95 Consolas,'Cascadia Code','Microsoft YaHei',monospace;padding:18px 20px;margin-bottom:20px;white-space:nowrap;overflow-wrap:normal;overflow-x:auto;max-width:100%}
.lesson-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lesson-nav a{font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;color:#bdcee1}
.lesson-nav a:hover{color:var(--cyan);border-color:var(--cyan)}
#lab-demo,#lab-controls,#math-guide,#explore-guide{scroll-margin-top:16px}
.control>label.check{justify-content:flex-start;align-items:flex-start;line-height:1.7}
.control>label.check input{flex:0 0 auto;margin-top:3px}
.lab-extras:empty{display:none}

  .lesson-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

  .lab-layout{grid-template-areas:"demo" "controls" "guides";grid-template-columns:minmax(0,1fr);gap:16px}

  .overlay{font-size:12px;left:8px;top:8px;padding:7px 9px;max-width:calc(100% - 16px)}
  .readout{font-size:13px;line-height:1.85;padding:14px;word-break:normal}
  .side{position:static;max-height:none;overflow:visible;padding:16px;scrollbar-gutter:auto}
  .console-summary{min-height:28px;padding-bottom:18px}
  .console-summary h2{font-size:17px}
  .console-summary span{font-size:12px}
  .side .control>label,.side .check{font-size:14px}
  .side h3{font-size:15px}
  .side input[type=checkbox]{width:18px;height:18px}
  .side input[type=range]{height:32px;margin:5px 0;touch-action:pan-y}

  .side button{min-height:44px;font-size:14px}
  .side .row{gap:8px}
  .side .point-row{grid-template-columns:32px repeat(3,minmax(0,1fr));gap:5px}
  .side .point-row button{min-height:40px;font-size:12px}
  .side .point-list{max-height:260px}
  .side .control select{font-size:16px}
  .side .control output{font-size:14px}
  .phase-list button{min-height:40px;font-size:12px}
  .info{padding:20px 18px}
  .info h2{font-size:20px;margin-bottom:16px}
  .info-theory p,.info-theory li{font-size:17px;line-height:1.95}
  .info-explore p,.info-explore li{font-size:16px;line-height:1.9}

  .split-labels{inset:0;width:100%;height:100%;display:block;padding:0;max-width:none;background:none}

  .split-labels span+span{top:calc(50% + 8px)}

  .lab-extras>.tangent-comparison{position:static;width:auto;max-width:380px;margin:12px auto;padding:12px 14px 4px;pointer-events:none}
  .lab-extras>.tangent-comparison strong{font-size:15px}
  .lab-extras{padding:0 10px}
  .hero h1{font-size:clamp(28px,8.2vw,34px)}
  .card-body p{font-size:15px;line-height:1.85}

}

/* Lesson 12: diagrams, node editors, and three synchronized heart viewports. */
body[data-page="12.bspline"] [hidden]{display:none!important}
.bs-extra{padding:16px;border-top:1px solid var(--line);min-width:0}
.bs-extra h3{color:#c4d6ea;margin-bottom:12px;line-height:1.65}
.bs-extra p{font-size:14px;color:#b8cbe1;line-height:1.8}
.bs-graph{display:block;width:100%;max-width:100%;touch-action:none;border:1px solid #273c53;border-radius:5px}
.bs-values{font:12px/1.9 Consolas,'Microsoft YaHei',sans-serif;white-space:pre-line;overflow-wrap:anywhere;margin:10px 0}
.bs-knot-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bs-knot-inputs label{font-size:12px;min-width:0;color:#a6bdd6}
.bs-knot-inputs input{width:100%;min-width:0;display:block}
.bs-knot-inputs input[aria-invalid="true"]{border-color:#f58ca9;background:#442a37}
.bs-feedback{font-size:13px;line-height:1.8;color:#f7bc69;overflow-wrap:anywhere}
.bs-heart-labels{position:absolute;inset:8px 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));pointer-events:none}
.bs-heart-labels span{font-size:11px;line-height:1.8;color:#c3d5e9;padding:5px 8px;background:#0b1421c9;border-right:1px solid #344b65}
.stage[data-bs-mode="4"]{height:350px}
.stage[data-bs-mode="4"] .bs-status{display:none}
.bs-heart-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bs-heart-panel{min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px}
.bs-heart-panel h3{font-size:13px}
.bs-heart-panel .bs-knot-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}
.bs-triangles{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;overflow-x:auto}
.bs-triangles.bs-comparing{grid-template-columns:repeat(2,minmax(0,1fr))}
.bs-recursion-row{display:flex;gap:5px;margin:8px 0;align-items:flex-start;flex-wrap:wrap}
.bs-recursion-row strong{font-size:12px;color:#a6bbd5;width:100%}
.bs-recursion-cell{display:block;border-left:3px solid #57dfcf;background:#132235;padding:7px;font:11px/1.8 Consolas,sans-serif;overflow-wrap:anywhere;max-width:100%}
.bs-continuity summary{font-size:13px;line-height:1.8;cursor:pointer;color:#b9d0e8;padding:6px 0}
@media(max-width:740px){
  .stage[data-bs-mode="4"]{height:900px}
  .bs-heart-labels{inset:0;display:block;height:100%}
  .bs-heart-labels span{position:absolute;top:8px;left:8px;font-size:12px;border:0}
  .bs-heart-labels span:nth-child(2){top:calc(33.333% + 8px)}
  .bs-heart-labels span:nth-child(3){top:calc(66.666% + 8px)}
  .bs-heart-columns,.bs-triangles.bs-comparing{grid-template-columns:minmax(0,1fr)}
  .bs-heart-panel .bs-knot-inputs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bs-knot-inputs input{font-size:16px;min-height:40px}
  .bs-extra{padding:12px}
  .bs-extra p,.bs-values{font-size:13px}
